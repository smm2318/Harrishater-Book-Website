<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داستان هری شاطر و XBOX جادویی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-color: #f8f8f2;
      --text-sub: #a0a0b0;
      --primary: #ff79c6;
      --accent: #8be9fd;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-color: #f4f5f9;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-sub: #6c757d;
      --primary: #d63384;
      --accent: #0d6efd;
      --border: rgba(0, 0, 0, 0.1);
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      max-width: 850px;
      margin-bottom: 20px;
    }

    .controls-group {
      display: flex;
      gap: 10px;
    }

    .btn-control {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .btn-control:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .main-title {
      font-size: 2.8rem;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 1.2rem;
      margin-bottom: 35px;
      line-height: 1.8;
    }

    .btn-gallery {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      padding: 14px 32px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
    }

    .btn-gallery:hover {
      transform: translateY(-3px);
      opacity: 0.95;
    }

    footer {
      margin-top: 40px;
      color: var(--text-sub);
      font-size: 0.9rem;
    }
  </style>
</head>
<body data-theme="dark">

  <div class="top-bar">
    <div class="controls-group">
      <button class="btn-control" id="themeBtn">🌙 شب / ☀️ روز</button>
      <button class="btn-control" id="langBtn">🌐 English</button>
    </div>
  </div>

  <div class="container">
    <h1 class="main-title" id="title">داستان هری شاطر</h1>
    <p class="subtitle" id="subtitle">ماجرای ۴ دوست، سیاهچاله‌های کیهانی و کنسول XBOX جادویی!</p>

    <a href="gallery.html" class="btn-gallery" id="btnGallery">🖼️ رفتن به گالری تصاویر</a>
  </div>

  <footer id="footerText">
    طراحی شده برای مینی وب‌سایت کتاب هری شاطر 🌟
  </footer>

  <script>
    let currentLang = 'fa';
    let currentTheme = 'dark';

    const translations = {
      fa: {
        title: "داستان هری شاطر",
        subtitle: "ماجرای ۴ دوست، سیاهچاله‌های کیهانی و کنسول XBOX جادویی!",
        btnGallery: "🖼️ رفتن به گالری تصاویر",
        langBtn: "🌐 English",
        footerText: "طراحی شده برای مینی وب‌سایت کتاب هری شاطر 🌟"
      },
      en: {
        title: "Harry Shater Story",
        subtitle: "The adventure of 4 friends, cosmic black holes, and a magical XBOX!",
        btnGallery: "🖼️ Go to Image Gallery",
        langBtn: "🌐 فارسی",
        footerText: "Designed for Harry Shater Book Mini-Website 🌟"
      }
    };

    document.getElementById('themeBtn').addEventListener('click', function() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', currentTheme);
    });

    document.getElementById('langBtn').addEventListener('click', function() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.documentElement.lang = currentLang;

      for (let key in translations[currentLang]) {
        const el = document.getElementById(key);
        if (el) el.innerText = translations[currentLang][key];
      }
    });
  </script>
</body>
</html>
